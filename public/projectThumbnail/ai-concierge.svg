    <line x1="820" y1="470" x2="1120" y2="330" />
    <line x1="820" y1="470" x2="1180" y2="560" />
    <line x1="820" y1="470" x2="600" y2="260" />
    <line x1="820" y1="470" x2="520" y2="620" />
    <line x1="820" y1="470" x2="960" y2="720" />
