<g id="about-introduction" data-semantic-role="about-introduction">
<text x="40" y="129" font-size="13" font-weight="400" fill="#064FF5" text-anchor="start" class="mono" letter-spacing="1.1">ABOUT ME</text>
<text x="40" y="215" font-size="66" font-weight="700" fill="#080B10">
<tspan x="40" y="215">From interfaces</tspan>
<tspan x="40" y="287">to AI systems.</tspan>
</text>
<text x="41" y="343" font-size="19" font-weight="400" fill="#080B10">
<tspan x="41" y="343">I’m Desheng Kong, an applied AI systems</tspan>
<tspan x="41" y="371">developer based in Melbourne.</tspan>
</text>
<text x="41" y="417" font-size="18" font-weight="400" fill="#080B10">
<tspan x="41" y="417">I work across LLM integration, knowledge retrieval,</tspan>
<tspan x="41" y="444">voice interfaces and workflow automation.</tspan>
</text>
<text x="41" y="487" font-size="18" font-weight="400" fill="#080B10">
<tspan x="41" y="487">My front-end background still shapes the interfaces</tspan>
<tspan x="41" y="514">I build around these systems.</tspan>
</text>
<text x="41" y="562" font-size="16" font-weight="500" fill="#064FF5" text-anchor="start">View selected work</text>
